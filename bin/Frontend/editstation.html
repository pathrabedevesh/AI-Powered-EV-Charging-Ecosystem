<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Station - ElectroHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/editstation.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html"><i class="fas fa-bolt"></i> ElectroHub</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="edit-wrapper">
            <div class="back-link">
                <a href="mystations.html"><i class="fas fa-arrow-left"></i> Back to My Stations</a>
            </div>

            <h1>Edit Station</h1>

            <form class="edit-form">
                <!-- Station Name & Status -->
                <div class="form-section">
                    <h2>Basic Information</h2>
                    <div class="form-group">
                        <label>Station Name</label>
                        <input type="text" value="Downtown Charging Hub" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select class="form-control">
                            <option value="active" selected>Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="maintenance">Maintenance</option>
                        </select>
                    </div>
                </div>

                <!-- Location -->
                <div class="form-section">
                    <h2>Location</h2>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" value="123 Main Street" class="form-control">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" value="New York" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" value="NY" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Zip Code</label>
                            <input type="text" value="10001" class="form-control">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Latitude</label>
                            <input type="number" value="40.7128" step="0.00001" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Longitude</label>
                            <input type="number" value="-74.0060" step="0.00001" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Charger Configuration -->
                <div class="form-section">
                    <h2>Charger Configuration</h2>
                    <div class="form-group">
                        <label>Charger Type</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" checked> DC Fast</label>
                            <label><input type="checkbox" checked> Level 2</label>
                            <label><input type="checkbox"> Level 1</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Price per kWh</label>
                        <div class="input-group">
                            <span>$</span>
                            <input type="number" value="2.99" step="0.01" class="form-control">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Total Slots</label>
                            <input type="number" value="24" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Available Slots</label>
                            <input type="number" value="12" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Operating Hours -->
                <div class="form-section">
                    <h2>Operating Hours</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Open Time</label>
                            <input type="time" value="06:00" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Close Time</label>
                            <input type="time" value="22:00" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="form-control" rows="4">Located in downtown district with 24/7 CCTV surveillance and friendly staff assistance.</textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ElectroHub. All rights reserved.</p>
    </footer>

    <script src="js/editstation.js"></script>
</body>
</html>
