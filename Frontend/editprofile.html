<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - ElectroHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/editprofile.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html"><i class="fas fa-bolt"></i> ElectroHub</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="edit-wrapper">
            <div class="back-link">
                <a href="profile.html"><i class="fas fa-arrow-left"></i> Back to Profile</a>
            </div>

            <h1>Edit Profile</h1>

            <form class="edit-form">
                <!-- Profile Picture -->
                <div class="form-section">
                    <h2>Profile Picture</h2>
                    <div class="profile-picture-upload">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&size=150" alt="Profile" id="previewImage">
                        <label class="upload-button">
                            <i class="fas fa-cloud-upload-alt"></i>
                            Choose Photo
                            <input type="file" hidden accept="image/*">
                        </label>
                        <p>JPG, PNG or GIF (Max 5MB)</p>
                    </div>
                </div>

                <!-- Personal Information -->
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" value="John" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" value="Doe" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="john.doe@example.com" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" value="+1 (555) 123-4567" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" value="1990-05-15" class="form-control">
                    </div>
                </div>

                <!-- Address Information -->
                <div class="form-section">
                    <h2>Address Information</h2>
                    <div class="form-group">
                        <label>Street Address</label>
                        <input type="text" value="456 Park Avenue" class="form-control">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" value="New York" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" value="NY" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Zip Code</label>
                            <input type="text" value="10022" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Vehicle Information -->
                <div class="form-section">
                    <h2>Vehicle Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Make</label>
                            <input type="text" value="Tesla" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Model</label>
                            <input type="text" value="Model 3" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Year</label>
                            <input type="number" value="2023" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" value="Blue" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>License Plate</label>
                        <input type="text" value="TESLA123" class="form-control">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ElectroHub. All rights reserved.</p>
    </footer>

    <script src="js/editprofile.js"></script>
</body>
</html>
