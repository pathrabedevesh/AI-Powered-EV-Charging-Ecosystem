<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - ElectroHub Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/managebookings.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar admin-nav">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html"><i class="fas fa-bolt"></i> ElectroHub Admin</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container admin-container">
        <div class="page-header">
            <h1>Manage Bookings</h1>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <input type="text" placeholder="Search booking ID, customer..." class="search-input">
            <select class="filter-select">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <!-- Bookings Table -->
        <div class="table-wrapper">
            <table class="bookings-table">
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Customer</th>
                        <th>Station</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#BK2025001847</td>
                        <td>John Doe</td>
                        <td>Downtown Hub</td>
                        <td>$7.13</td>
                        <td>Today 2:00 PM</td>
                        <td><span class="status active">Active</span></td>
                        <td>
                            <button class="btn-action"><i class="fas fa-eye"></i></button>
                            <button class="btn-action danger"><i class="fas fa-ban"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ElectroHub Admin Panel. All rights reserved.</p>
    </footer>

    <script src="js/managebookings.js"></script>
</body>
</html>
