<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - ElectroHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/payment.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html"><i class="fas fa-bolt"></i> ElectroHub</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="payment-wrapper">
            <div class="payment-content">
                <!-- Order Summary -->
                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-item">
                        <span>Downtown Charging Hub</span>
                        <span>Slot A3</span>
                    </div>
                    <div class="summary-item">
                        <span>Date & Time</span>
                        <span id="dateTimeDisplay">Today, 2:00 PM - 4:00 PM</span>
                    </div>
                    <div class="summary-item">
                        <span>Charger Type</span>
                        <span>DC Fast Charging</span>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-item total">
                        <span>Total Amount</span>
                        <span>$7.13</span>
                    </div>
                </div>

                <!-- Payment Methods -->
                <div class="payment-section">
                    <h3>Payment Method</h3>
                    <div class="payment-methods">
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="card" checked>
                            <span><i class="fas fa-credit-card"></i> Credit/Debit Card</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="wallet">
                            <span><i class="fas fa-wallet"></i> ElectroHub Wallet</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="upi">
                            <span><i class="fas fa-mobile-alt"></i> UPI</span>
                        </label>
                    </div>
                </div>

                <!-- Card Payment Form -->
                <div class="payment-form" id="cardPaymentForm">
                    <h3>Card Details</h3>
                    <div class="form-group">
                        <label>Cardholder Name</label>
                        <input type="text" placeholder="John Doe" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" placeholder="1234 5678 9012 3456" class="form-control" maxlength="19">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" placeholder="MM/YY" class="form-control" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" placeholder="123" class="form-control" maxlength="3">
                        </div>
                    </div>
                </div>

                <!-- Wallet Balance -->
                <div class="wallet-info" id="walletInfo" style="display: none;">
                    <div class="wallet-balance">
                        <i class="fas fa-wallet"></i>
                        <div>
                            <p>Available Balance</p>
                            <h3>$124.50</h3>
                        </div>
                    </div>
                </div>

                <!-- Security Info -->
                <div class="security-info">
                    <i class="fas fa-lock"></i>
                    <span>Your payment information is secure and encrypted</span>
                </div>

                <!-- Action Buttons -->
                <div class="payment-actions">
                    <button class="btn btn-secondary" onclick="window.history.back()">Back</button>
                    <button id="payBtn" class="btn btn-primary" onclick="processPayment()">Pay $7.13</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ElectroHub. All rights reserved.</p>
    </footer>

    <script src="js/payment.js"></script>
</body>
</html>
